name: Render Keep-Alive

# Issue #42 — Render Free spins the sahaiy-backend instance down after
# ~15 min idle; the next visitor eats a 50s+ cold start. This cron pings
# /health every 10 minutes so the service stays warm during demo windows.
#
# Budget note: 6 runs/hour x 24h ≈ 4,320 runs/month. Each run is a single
# curl (seconds of a free ubuntu runner) — well inside GitHub Actions'
# 2,000 free minutes/month for private repos and unmetered for public ones.
# If the budget ever matters, tighten the cron to demo hours only.
#
# The backend URL lives in an Actions secret (RENDER_BACKEND_URL) so the
# URL stays overridable without touching this file. It falls back to the
# known production URL when unset.

on:
  schedule:
    # Every 10 min at an odd minute (avoids top-of-hour load spikes).
    - cron: "3/10 * * * *"
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render backend /health
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${BACKEND_URL:-https://sahaiy-backend.onrender.com}"
          URL="${URL%/}/health"
          echo "Pinging $URL"

          # A cold instance can take 50 s+ to wake — retry with backoff so a
          # cold start doesn't fail the run.
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 120 -o /tmp/health.json -w '%{http_code}' "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              ok=1
              echo "Attempt $attempt: HTTP $code ✓"
              cat /tmp/health.json
              break
            fi
            echo "Attempt $attempt: HTTP $code — retrying in 30 s (cold start can take up to ~90 s)..."
            sleep 30
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Render backend /health did not return 200 after 3 attempts. Check https://dashboard.render.com/web/srv-da79l1ou01pc738n5bkg (deploys/logs)."
            exit 1
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Render keep-alive"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "- ✅ Backend responded HTTP 200 on \`/health\` — idle timer reset."
            else
              echo "- ❌ Keep-alive failed — inspect the ping step logs and the Render dashboard."
            fi
            echo "- Run: \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
