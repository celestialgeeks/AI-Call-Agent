# ops/docker-compose.demo.yml — Sahaiy in-person demo, container mode (ADR-0002 Track B)
#
# Runs the SAME backend serving code as production in a container on the Mac.
# Requires Docker Desktop or OrbStack. Start with:
#   ./scripts/demo-local.sh --docker
# Frontend stays native (Vite dev server) for zero-build iteration; point the
# browser at http://localhost:5173.

services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn server:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ../sahaiy-backend:/app
      # .env is read from the mounted repo dir — never baked into an image.
    environment:
      # Local demo defaults; real values come from sahaiy-backend/.env via env_file.
      DEMO_MODE: "1"
    env_file:
      - ../sahaiy-backend/.env
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
